<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ollie Dental Clinic</title>
<link rel="icon" href="https://ik.imagekit.io/GotoLink/Links/Ollie/Logo2(1).ico" type="image/x-icon">
<style>
  :root{
  --accent: rgba(255, 255, 255, 0.6); 
  --accent-hover: rgba(255, 255, 255, 0.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

body {
  background: url('https://ik.imagekit.io/GotoLink/Links/Ollie/BG.jpg') no-repeat center center fixed;
  background-size: cover;
  height: 100vh;
  margin: 0;
  font-family: "Poppins", sans-serif;
  color: #1d4795;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px; 
  position: relative;
}

/* طبقة حماية عامة خفيفة جداً للموقع */
body::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 255, 255, 0.05);
  z-index: 1;
}

  .wrap{
    position:relative;
    z-index:5;
    width: 100%;
    max-width: 480px; 
    text-align:center;
    padding: 60px 45px; 
    zoom: 0.85; 
    -moz-transform: scale(0.85); 
    
    /* حدة الحواف 50px */
    border-radius: 50px;
    
    /* توسيع نطاق التلاشي (Feather) ليكون أعمق وأكبر انتشاراً */
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 35%, rgba(255,255,255,0.5) 65%, rgba(255,255,255,0.15) 85%, rgba(255,255,255,0) 100%);
    
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(2px);
  }
  
  .profile-pic{
    width:140px;height:140px;border-radius:50%;object-fit:cover;
    border:4px solid rgba(255,255,255,0.9);
    box-shadow:0 8px 30px rgba(0,0,0,0.15);
    margin:0 auto 18px;display:block;
  }

  .links{display:flex;flex-direction:column;gap:12px;align-items:center}
.link {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 340px;
  padding: 12px 18px;
  border-radius: 30px;
  background: var(--accent);
  color: #1d4795; 
  text-decoration: none;
  font-weight: 700; 
  transition: transform .18s ease, background .18s ease, box-shadow .18s;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5); 
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

.link:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
}
  .icon{width:22px;height:22px;flex:0 0 22px;display: flex; align-items: center; justify-content: center;}
  .label{flex:1;text-align:center}

.link.website:hover { background: rgba(0, 123, 255, 0.25); color: #007bff; }
.link.website:hover .icon i { color: #007bff; }
.link.location:hover { background: rgba(234, 67, 53, 0.25); color: #EA4335; }
.link.location:hover .icon i { color: #EA4335; }
.link.review:hover { background: rgba(251, 188, 5, 0.25); color: #fbbc05; }
.link.review:hover .icon i { color: #fbbc05; }
.link.facebook:hover { background: rgba(24, 119, 242, 0.25); color: #1877f2; }
.link.facebook:hover .icon i { color: #1877f2; }
.link.instagram:hover { background: rgba(225, 48, 108, 0.25); color: #e1306c; }
.link.instagram:hover .icon i { color: #e1306c; }
.link.tiktok:hover { background: rgba(0, 0, 0, 0.15); color: #000000; }
.link.tiktok:hover .icon i { color: #000000; }
.link.phone:hover { background: rgba(40, 167, 69, 0.25); color: #28a745; }
.link.phone:hover .icon i { color: #28a745; }

  footer.footer{margin-top:28px;color:rgba(0, 0, 0, 0.85);font-size:9px}
  footer.footer a{color:inherit;text-decoration:underline}

  .social-icons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
    align-items: center;
  }
  .social-icons a {
  color: #1d4795; 
  font-size: 22px;
  transition: 0.3s;
  display: flex;
  align-items: center;
  text-decoration: none;
}

.social-icons a:hover { transform: scale(1.2); }
.social-icons a.website:hover { color: #007bff; }
.social-icons a.location:hover { color: #EA4335; }
.social-icons a.review:hover { color: #fbbc05; }
.social-icons a.facebook:hover { color: #1877f2; }
.social-icons a.instagram:hover { color: #e1306c; }
.social-icons a.tiktok:hover { color: #000000; }
.social-icons a.phone:hover { color: #28a745; }

  @media(max-width:420px){
    .wrap{ padding-bottom:40px; padding-top:40px; max-width: 92%; padding-left: 20px; padding-right: 20px; zoom: 0.85; }
    .link{max-width:100%;}
    .profile-pic{width:120px;height:120px}
  }
  .info-section {
    margin-bottom: 25px;
}

h1 {
    font-size: 26px; 
    font-weight: 900;
    color: #1d4795; 
    margin-bottom: 5px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.tagline {
    font-size: 14px;
    color: #222; 
    margin-bottom: 8px;
    font-weight: 600;
}

.description {
    font-size: 12px;
    color: #333;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.9;
    position: relative;
    font-weight: 600;
}

.description::after {
    content: '';
    display: block;
    width: 40px;
    height: 2px;
    background: #ff6a00;
    margin: 8px auto 0;
    border-radius: 2px;
}

/* تثبيت اتجاه اللغات من اليسار لليمين لمنع تغير الترتيب عند التحويل للعربية */
.lang-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    direction: ltr !important;
}
.lang-btn {
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255,255,255,0.4);
    cursor: pointer;
    border-radius: 8px;
    padding: 5px;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 45px;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}
.lang-btn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-3px); }
.lang-btn img { width: 28px; height: 18px; border-radius: 2px; object-fit: cover; }
.lang-btn span { font-size: 9px; font-weight: bold; margin-top: 3px; color: #1d4795; }

</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body dir="ltr">

    <nav class="links">

      <!-- زر الاتصال الثاني -->
      <a class="link phone" href="tel:01200822684">

          <span class="label" id="btn-phone2">Contact Us</span>
      </a>

      <a class="link facebook" href="https://www.facebook.com/share/1EVUjpoVvc/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">
        <div class="icon"><i class="fab fa-facebook-f"></i></div>
        <span class="label" id="btn-fb">Facebook</span>
      </a>

      <a class="link instagram" href="https://www.instagram.com/dr.oliviamedhat?srtk=bjU2MXlxdjFsMGM1&utm_source=qr" target="_blank" rel="noopener noreferrer">
        <div class="icon"><i class="fab fa-instagram"></i></div>

    </nav>

    <div class="social-icons">
        <a href="#" target="_blank" class="website" title="Website"><i class="fas fa-globe"></i></a>
        <a href="https://maps.app.goo.gl/LiVUeRxGngYaUpKz5" target="_blank" class="location" title="Location"><i class="fas fa-location-dot"></i></a>
        <a href="https://search.google.com/local/writereview?placeid=ChIJ9TEoZs6HUhQRUSRrNLBIhLU" target="_blank" class="review" title="Review"><i class="fas fa-star"></i></a>
        <a href="tel:01092168284" class="phone" title="Call"><i class="fas fa-phone"></i></a>
        <a href="https://www.facebook.com/share/1EVUjpoVvc/?mibextid=wwXIfr" target="_blank" class="facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/dr.oliviamedhat?srtk=bjU2MXlxdjFsMGM1&utm_source=qr" target="_blank" class="instagram" title="Instagram"><i class="fab fa-instagram"></i></a>

	<footer class="footer">
	  <p>© <span id="year"></span> GoLink Design</p>

<script>
const translations = {
    en: {
        title: "Ollie Dental Clinic", 
        tagline: "Make Happiness A Habit", 
        desc: "Advanced Dental Care & Smile Design",
        web: "Website", loc: "Our Location", review: "Google Review", phone: "Contact Us", facebook: "Facebook", instagram: "Instagram", tiktok: "TikTok", dir: "ltr"
    },
    ar: {
        title: "عيادة أولي للأسنان", 
        tagline: "اجعل السعادة عادة", 
        desc: "رعاية أسنان متقدمة وتصميم ابتسامة",
        web: "الموقع الإلكتروني", loc: "موقع العيادة", review: "تقييم العيادة على جوجل", phone: "تواصل معنا", facebook: "فيسبوك", instagram: "انستجرام", tiktok: "تيك توك", dir: "rtl"
    },
    de: {
        title: "Ollie Dental Clinic", 
        tagline: "Mache Glück Zur Gewohnheit", 
        desc: "Fortschrittliche Zahnpflege & Lächeln-Design",
        web: "Webseite", loc: "Unser Standort", review: "Google Bewertung", phone: "Kontaktiere uns", facebook: "Facebook", instagram: "Instagram", tiktok: "TikTok", dir: "ltr"
    },
    fr: {
        title: "Ollie Dental Clinic", 
        tagline: "Faites Du Bonheur Une Habitude", 
        desc: "Soins dentaires avancés et design du sourire",
        web: "Site Web", loc: "Notre Emplacement", review: "Avis Google", phone: "Contactez-nous", facebook: "Facebook", instagram: "Instagram", tiktok: "TikTok", dir: "ltr"
    },
    ru: {
        title: "Ollie Dental Clinic", 
        tagline: "Сделай Счастье Привычкой", 
        desc: "Передовой уход за зубами и дизайн улыбки",
        web: "Веб-сайт", loc: "Наш адрес", review: "Отзывы в Google", phone: "Связаться с нами", facebook: "Facebook", instagram: "Instagram", tiktok: "TikTok", dir: "ltr"
    }
};

function setLang(lang) {
    const data = translations[lang];
    document.getElementById('txt-title').innerText = data.title;
    document.getElementById('txt-tagline').innerText = data.tagline;
    document.getElementById('txt-desc').innerText = data.desc;
    document.getElementById('btn-web').innerText = data.web;
    document.getElementById('btn-loc').innerText = data.loc;
    document.getElementById('btn-review').innerText = data.review;
    document.getElementById('btn-phone1').innerText = data.phone;
    document.getElementById('btn-phone2').innerText = data.phone;
    document.getElementById('btn-fb').innerText = data.facebook;
    document.getElementById('btn-ig').innerText = data.instagram;
    document.getElementById('btn-tk').innerText = data.tiktok;
    document.body.dir = data.dir;
}

// تبديل اسم التاب (Browser Tab Title) كل ثانية واحدة بالتناوب
const tabTitles = [
    "Make Happiness A Habit",
    "Ollie Dental Clinic"
];
let currentTitleIndex = 0;

setInterval(() => {
    currentTitleIndex = (currentTitleIndex + 1) % tabTitles.length;
    document.title = tabTitles[currentTitleIndex];
}, 1000);

document.getElementById("year").textContent = new Date().getFullYear();
</script>
